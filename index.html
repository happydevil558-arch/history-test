const source = [{"q": "Какой период считается самым древним этапом истории человечества?", "a": ["Палеолит", "Неолит", "Энеолит", "Бронзовый век", "Железный век"], "correct": 0}, {"q": "Какой археологический памятник Казахстана известен древними каменными орудиями эпохи палеолита?", "a": ["Бориказган", "Бесшатыр", "Иссык", "Берел", "Отырар"], "correct": 0}, {"q": "С каким периодом истории Казахстана связано Ботайское поселение?", "a": ["Энеолитом", "Палеолитом", "Средневековьем", "Неолитом", "Мезолитом"], "correct": 0}, {"q": "Какую культуру Казахстана относят к эпохе бронзы?", "a": ["Андроновскую культуру", "Ботайскую культуру", "Сакскую культуру", "Уйсуньскую культуру", "Кангюйскую культуру"], "correct": 0}, {"q": "Какой метод применяется для определения возраста древних органических останков?", "a": ["Радиоуглеродный анализ", "Лингвистический анализ", "Радиоизотопный анализ", "Калий-аргоновый метод", "Палеомагнитный анализ"], "correct": 0}, {"q": "Какое важное изменение произошло в хозяйственной жизни людей в эпоху бронзы?", "a": ["Получило развитие производство металлических орудий труда и возникло пастушеское скотоводство", "Сложилось кочевое скотоводство и началось массовое освоение железа", "Прекратилось использование кремнёвых и каменных орудий труда", "Появились первые городские поселения оседлых земледельцев в Семиречье", "Возникло первое разделение труда классического типа"], "correct": 0}, {"q": "Какой металл использовался для изготовления бронзы?", "a": ["Медь и олово", "Медь и серебро", "Золото и свинец", "Серебро и олово", "Железо и цинк"], "correct": 0}, {"q": "Каким периодом датируются Шиликтинские сакские курганы?", "a": ["VIII–VII вв. до н. э.", "VII–VII вв. до н. э.", "IX–VIII вв. до н. э.", "V–IV вв. до н. э.", "VI–V вв. до н. э."], "correct": 0}, {"q": "Какие курганы расположены в Зайсанском районе Восточно-Казахстанской области?", "a": ["Шиликтинские", "Иссыкские", "Берельские", "Боралдайские", "Джетитобе"], "correct": 0}, {"q": "Как назывались древние племена, населявшие значительную часть территории Казахстана в раннем железном веке?", "a": ["Саки", "Кангюи", "Уйсуни", "Хунну", "Тюрки"], "correct": 0}, {"q": "Какой археологический памятник Казахстана прославился находкой сакского «Золотого человека» в 1969 году?", "a": ["Иссыкский курган", "Бесшатырский курган", "Берельский курган", "Ботайское поселение", "Курган Аралтобе"], "correct": 0}, {"q": "Какой памятник раннего железного века известен крупными сакскими курганами в Жетысу?", "a": ["Бесшатыр", "Ботай", "Чиликты", "Берель", "Байгетобе"], "correct": 0}, {"q": "В каком регионе Казахстана расположен Шиликтинский курганный комплекс?", "a": ["В Восточном Казахстане", "В Западном Казахстане", "В Южном Казахстане", "В Северном Казахстане", "В Центральном Казахстане"], "correct": 0}, {"q": "Какой древнегреческий историк оставил сведения о саках и других народах древности?", "a": ["Геродот", "Платон", "Аристотель", "Сократ", "Фукидид"], "correct": 0}, {"q": "Какое древнее племенное объединение создало мощную политическую державу в Центральной Азии?", "a": ["Хунну", "Кангюи", "Сарматы", "Древние греки", "Уйсуни"], "correct": 0}, {"q": "С каким регионом Казахстана особенно связана история усуней?", "a": ["Жетысу", "Мангистау", "Прикаспийская низменность", "Северное Приаралье", "Тургайское плато"], "correct": 0}, {"q": "В бассейне какой реки располагалось древнее государство Кангюй?", "a": ["Сырдарьи", "Иртыша", "Урала", "Едил", "Амударьи"], "correct": 0}, {"q": "Основной район распространения Жетыасарской культуры кангюев:", "a": ["Долины Куандарьи и Жанадарьи", "Отрарский оазис", "Среднее течение Сырдарьи", "Прииртышье", "Между Жаиком и Едилем"], "correct": 0}, {"q": "Какой вид деятельности относится к присваивающему хозяйству?", "a": ["Охота и собирательство", "Земледелие и собирательство", "Выращивание зерновых культур и собирательство", "Охота и разведение домашних животных", "Ремесленное производство товаров"], "correct": 0}, {"q": "С каким государством ы", "Способствовал обособлению отдельных человеческих стад друг от друга", "Не влиял на развитие коллективных форм охоты"], "correct": 0}, {"q": "Что является главным свидетельством высокого уровня развития духовной культуры и мировоззрения древних племён эпохи бронзы и железа?", "a": ["Погребальные обряды, наскальные рисунки (петроглифы) и культовые предметы", "Количество одомашненных видов животных в стаде", "Размеры и укрепленность временных зимних стоянок", "Объем добываемой медной и оловянной руды", "Плотность населения в пределах одного родового союза"], "correct": 0}, {"q": "Начало тюркизации восточно-иранских племен связано с проникновением в Казахстан:", "a": ["Хуннов", "Саков", "Тюрков", "Усуней", "Дунху"], "correct": 0}, {"q": "Во время походов в какие страны саки познакомились с традицией «звериного стиля»?", "a": ["Переднюю Азию и Иран", "Индию", "Китай и Индию", "Переднюю Азию и Индию", "Парфию и Бактрию"], "correct": 0}, {"q": "Человек современного вида (Homo sapiens) формируется в период…", "a": ["Позднего палеолита", "Среднего палеолита", "Времени мустье", "Раннего палеолита", "Мезолита"], "correct": 0}, {"q": "В трудах какого древнегреческого историка встречается упоминание о храброй и мудрой царице Томирис?", "a": ["Ктесий Книдский", "Аммиан Марцеллин", "Арриан", "Квинт Курций", "Полибий"], "correct": 0}, {"q": "Какой социально-экономический процесс способствовал появлению имущественного неравенства в эпоху бронзы?", "a": ["Появление излишков продуктов, выделение парных семей и зарождение частной собственности", "Переход от матриархата к патриархату при сохранении общей собственности и зарождение частной собственности", "Полный отказ от земледелия в пользу охоты и собирательства", "Переселение племен андроновской культуры на юг и зарождение частной собственности", "Появление излишков продуктов и формирование первых кочевых племенных союзов"], "correct": 0}, {"q": "Какую роль играло скотоводство в жизни ранних кочевников Казахстана?", "a": ["Обеспе function advance(){if(selected===null)return;index++;if(index>=deck.length){finish();return}$('next').onclick=submit;$('skip').disabled=false;render()}
function skip(){answersLog.push({q:deck[index].q,chosen:'Пропущено',correct:deck[index].opts.find(x=>x.correct).text,ok:false});index++;if(index>=deck.length){finish();return}render()}
function finish(){ $('quiz').classList.add('hidden');$('result').classList.remove('hidden');let n=answersLog.length,p=Math.round(score/n*100);$('percent').textContent=p+'%';$('right').textContent=score+'/'+n;$('wrong').textContent=n-score;$('verdict').textContent=p>=90?'Отлично. Материал явно не успел тебя победить.':p>=70?'Хороший результат. Повтори ошибки и закрепи даты.':p>=50?'Есть база, но некоторые темы пока плавают. Разбор ошибок поможет.':'Ничего страшного. Теперь понятно, что повторять. Пройди тест ещё раз.';$('review').innerHTML='';answersLog.filter(x=>!x.ok).forEach((x,i)=>{let d=document.createElement('div');d.className='review';let q=document.createElement('b');q.textContent=(i+1)+'. '+x.q;let a=document.createElement('div');a.className='muted';a.textContent='Твой ответ: '+x.chosen;let c=document.createElement('div');c.style.color='var(--good)';c.textContent='Правильный ответ: '+x.correct;d.append(q,a,c);$('review').appendChild(d)});$('showReview').textContent=`Разобрать ошибки (${n-score})`}
$('next').onclick=submit;$('skip').onclick=skip;$('restartTop').onclick=start;$('again').onclick=start;$('showReview').onclick=()=>{$('review').classList.toggle('hidden');$('showReview').textContent=$('review').classList.contains('hidden')?'Разобрать ошибки':'Скрыть разбор'};start();
</script></main></body></html>
